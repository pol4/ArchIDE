{{- if and .Values.config.llm.apiKey (not .Values.config.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "archide.secretName" . }}
  labels:
    {{- include "archide.labels" . | nindent 4 }}
type: Opaque
stringData:
  # the key never reaches git: pass it with --set-string config.llm.apiKey=…
  # or manage it with the platform's secret store (external-secrets).
  ARCHIDE_LLM_API_KEY: {{ .Values.config.llm.apiKey | quote }}
{{- end }}
