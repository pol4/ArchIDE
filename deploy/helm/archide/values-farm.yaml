# Значения для платформы `farm` (онбординг тенанта, см.
# docs/PLATFORM_MIGRATION_PLAN.md).
#
# Тенант живёт в `t-archide-app`, приложение разворачивается ArgoCD
# (AppProject `tenant-archide`) из `deploy/tenant/`. Платформенные ресурсы
# (Harbor project+robot, Vault role+KV, Keycloak client, AppProject) создаёт
# Platform Team по заявке — здесь их нет.
#
# Образы: harbor.platform.local/<project>/<app>:<git-sha>; тег `latest`
# запрещён политикой платформы. Pull — через ExternalSecret `harbor-pull`
# (dockerconfigjson), назначенный на default ServiceAccount тенанта.

image:
  repository: harbor.platform.local/archide/archide
  # обязательный тег — короткий git-SHA сборки (deploy/build.sh --tag …)
  tag: "REPLACE_WITH_GIT_SHA"
  pullPolicy: IfNotPresent
  # pull-секрет выдаёт ESO (harbor-pull) и вешает на default SA — в поде не нужен
  pullSecrets: []

config:
  runner: local
  llm:
    # живая модель доступна только если для неё разрешён egress;
    # иначе первый деплой идёт в mock
    baseUrl: "http://192.168.20.20:8000/v1"
    model: "Qwen3.8-27B-UD-Q5_K_XL"
    mode: "mock"
    # ключ приходит из Vault через ExternalSecret, не из значений
    existingSecret: archide-secrets

persistence:
  enabled: true
  size: 10Gi
  storageClass: ceph-rwo
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 8000

# маршрутизацию для тенантов платформа отдаёт через ingress-nginx
# (как в эталонном t-demo-app) либо через platform-gateway (HTTPRoute)
ingress:
  enabled: true
  className: nginx
  host: archide.platform.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 3Gi
